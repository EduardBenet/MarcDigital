version: "2.1"
services:
  digital_frame:
    build: .
    restart: always
    privileged: true # needed for SDL2 fullscreen graphics on Pi
    # No secrets in this file, and deliberately not even declared here.
    # The five AZURE_*/CONTAINER_NAME values are balena fleet (or device)
    # service variables — balena injects those into the container on its own.
    # Declaring them as valueless pass-throughs would resolve to empty strings
    # on the builder and shadow the dashboard values.
    # For local dev: `docker run --env-file .env`, or `cargo run` with .env loaded.
    environment:
      # SDL renders straight to the KMS/DRM display — there is no X11 or Wayland
      # session on the frame.
      - SDL_VIDEODRIVER=kmsdrm
    labels:
      # Re-triggers container start when display/input devices appear, so the
      # frame recovers if it boots before the HDMI device is enumerated.
      io.balena.features.dbus: "1"
    devices:
      - /dev/dri:/dev/dri # GPU / KMS nodes for the fullscreen slideshow
    volumes:
      - synced_photos:/digital_frame/synced_photos
    network_mode: "host" # ensures SDL2 can access display if needed

  # Wi-Fi provisioning for a frame that will live on someone else's network.
  #
  # Without this a frame handed to a relative can never join their Wi-Fi: there
  # is no keyboard, no shell, and no input on the slideshow. It would sit there
  # replaying whatever photos were cached before delivery, forever.
  #
  # The balenaLabs block watches connectivity and, when the device cannot reach
  # a network, raises its own hotspot with a captive portal. A phone joins that
  # hotspot, picks the house network, types the password, and the credentials
  # are saved to NetworkManager. It stands down once connected.
  #
  # The slideshow keeps running throughout - the two services are independent,
  # so the frame shows its existing photos while waiting to be provisioned.
  wifi-connect:
    # Built from the upstream release, not the balenaLabs block: that block's
    # published image dates from 2020 and dies on current balenaOS with
    # "RsnFlags property failed: wrong property type". See wifi-connect/Dockerfile.
    build: ./wifi-connect
    restart: always
    # Must share the host network stack to manage the real interfaces.
    network_mode: host
    cap_add:
      - NET_ADMIN
    labels:
      # NetworkManager lives on the host's D-Bus. Without this the block cannot
      # scan for networks, raise the hotspot, or persist the chosen credentials.
      io.balena.features.dbus: "1"
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      # The hotspot name the family will see on their phone. Keep it recognisable
      # - this is the only instruction they get.
      - PORTAL_SSID=MarcDigital Setup
      # Give a known network time to associate on boot first, so a normal reboot
      # does not briefly raise a setup hotspot.
      - DELAY_BEFORE_CONFIGURING=30

volumes:
  synced_photos:
