name: Release to balena

# Tagging is the release action: push a `v*` tag and the fleet gets a release
# built from that exact commit.
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# Required repository secret:
#   BALENA_TOKEN  - balenaCloud > Preferences > Access tokens (an API key, not
#                   the session token). The balena CLI reads it from the
#                   environment, so no explicit `balena login` step is needed.
#
# Optional repository variable:
#   BALENA_FLEET  - fleet slug; falls back to the value below.

on:
  push:
    tags:
      - "v*"
  # Manual runs are useful for re-cutting a release without moving a tag.
  workflow_dispatch:
    inputs:
      draft:
        description: "Build a draft release instead of deploying to the fleet"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Never ship something that would not pass CI. Reuses the same workflow rather
  # than a copy of its steps.
  verify:
    uses: ./.github/workflows/main.yml

  release:
    name: Build and deploy on balena
    needs: verify
    runs-on: ubuntu-latest
    # Overrides the read-only default above: creating a GitHub Release writes
    # to the repository.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node (balena CLI is an npm package)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install balena CLI
        run: npm install -g balena-cli

      # An explicit login is required. The CLI does NOT read a plain
      # `BALENA_TOKEN` environment variable - only its own `BALENARC_`-prefixed
      # names - so relying on the env alone fails with "Login required" even
      # though the secret is present. `balena login --token` is unambiguous, and
      # the credential it writes to ~/.balena persists for later steps.
      - name: Log in to balena
        env:
          BALENA_TOKEN: ${{ secrets.BALENA_TOKEN }}
        run: |
          if [ -z "$BALENA_TOKEN" ]; then
            echo "::error::BALENA_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions (balenaCloud > Preferences > Access tokens)."
            exit 1
          fi
          balena login --token "$BALENA_TOKEN"
          echo "Authenticated as: $(balena whoami)"

      # Give the balena release the same identity as the git tag. Without this
      # the dashboard shows anonymous commit-hash releases and there is no way
      # to tell at a glance which release corresponds to which tag.
      - name: Stamp release version from the git tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"   # v1.0.1 -> 1.0.1
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not semver. balena release versioning needs MAJOR.MINOR.PATCH (tags may be prefixed with 'v')."
            exit 1
          fi
          sed -i -E "s/^version: .*/version: $VERSION/" balena.yml
          echo "balena.yml now declares: $(grep '^version:' balena.yml)"

      # balena builds the arm64 image on its own native builders, so there is no
      # cross-compile or QEMU step here - we only hand it the source.
      #
      # `--draft` produces a release that is built and stored but NOT rolled out;
      # promote it from the dashboard when ready. Tag pushes deploy directly;
      # manual runs default to draft so you can rehearse safely.
      - name: Push release to balena
        env:
          BALENA_FLEET: ${{ vars.BALENA_FLEET || 'g_eduard_benet/digiframe' }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          DRAFT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT="--draft"
            echo "Building a DRAFT release (not rolled out to devices)."
          else
            echo "Building and DEPLOYING to $BALENA_FLEET."
          fi

          balena push "$BALENA_FLEET" \
            --source . \
            $DRAFT \
            --release-tag version "$VERSION" commit "${{ github.sha }}"

      # A balena release is not a GitHub Release. Without this the Releases page
      # stays empty however many tags exist, and there is no readable record of
      # what changed between versions. Runs only for real tags, and only after
      # the balena push succeeded - a GitHub Release announcing a deploy that
      # never happened would be worse than none.
      #
      # Uses the built-in `gh` CLI and `github.token`; no third-party action and
      # no extra secret.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it untouched."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
            echo "Created GitHub Release $TAG."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### balena release"
            echo ""
            echo "- Fleet: \`${{ vars.BALENA_FLEET || 'g_eduard_benet/digiframe' }}\`"
            echo "- Version: \`${{ github.ref_type == 'tag' && github.ref_name || github.sha }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
