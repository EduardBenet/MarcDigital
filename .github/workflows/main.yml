name: Marc Digital

on:
  push:
  pull_request:
  # Callable so the release workflow can gate a balena deploy on these exact
  # checks, instead of duplicating them and letting the two drift apart.
  # NOTE: GitHub resolves a reusable workflow at the *calling ref's* commit, so
  # a tag created before this trigger existed fails with "workflow is not
  # reusable". Tags must point at a commit that contains this block.
  workflow_call:

jobs:
  build:
    name: Rust build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install SDL2 dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # `--workspace` matters: the root package is the default member, so
      # without it `core` (where all the tests live) is never checked.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release
