[package]
name = "marcdigital-core"
version = "0.1.0"
edition = "2024"

# Pure logic (config, sync diff). Deliberately depends on NOTHING heavy (no SDL2,
# no Azure SDK) so `cargo test -p marcdigital-core` compiles in seconds anywhere.
[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.91"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
